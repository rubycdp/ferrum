<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Selawik</family></accept>
  </alias>
  <alias binding="same">
    <family>Tahoma</family>
    <accept><family>DejaVu Sans</family></accept>
  </alias>
</fontconfig>
